<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リッチメニュー画像 | 建築資源循環ラボ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Hiragino Sans', sans-serif; background: #f5f5f5; color: #333; padding: 16px; }
  h1 { font-size: 16px; text-align: center; color: #2d6a4f; margin-bottom: 8px; }
  .note { font-size: 12px; color: #666; text-align: center; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 400px; margin: 0 auto; }
  .cell { position: relative; }
  .cell canvas { width: 100%; border-radius: 8px; display: block; }
  .dl-btn { display: block; margin-top: 4px; background: #2d6a4f; color: white; border: none; border-radius: 6px; padding: 6px; font-size: 12px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; }
  .dl-btn.done { background: #06C755; }
  .full { margin-top: 20px; max-width: 400px; margin-left: auto; margin-right: auto; }
  .full canvas { width: 100%; border-radius: 8px; display: block; }
  .sep { border-top: 1px solid #ddd; margin: 24px 0 16px; padding-top: 12px; }
  .sep h2 { font-size: 14px; color: #2d6a4f; text-align: center; margin-bottom: 4px; }
  .sep p { font-size: 12px; color: #666; text-align: center; }
</style>
</head>
<body>

<h1>リッチメニュー画像ダウンロード</h1>
<p class="note">画像を長押し →「写真に追加」または「画像を保存」でカメラロールに保存できます</p>

<div class="sep">
  <h2>一枚画像（これ1枚でOK）</h2>
  <p>この画像を長押し →「写真に追加」→ リッチメニューの背景画像にアップロード</p>
</div>
<div class="full">
  <img id="fullImg" style="width:100%;border-radius:8px;" alt="リッチメニュー一枚画像">
</div>


<script>
var items = [
  { icon: '🏗️', label: 'サービス内容', sub: 'Service' },
  { icon: '💬', label: '相談する', sub: 'Contact' },
  { icon: '📋', label: '相談テーマ', sub: 'Themes' },
  { icon: '🤝', label: 'パートナー募集', sub: 'Partner' },
  { icon: '👥', label: '仲間になる', sub: 'Join Us' },
  { icon: '❓', label: 'よくある質問', sub: 'FAQ' }
];

var W = 625, H = 562; // 各セルサイズ (2500/2 x 1686/3 に近い値)

function drawCell(ctx, item, x, y, w, h) {
  // 背景
  ctx.fillStyle = '#2d6a4f';
  ctx.fillRect(x, y, w, h);
  // 内側に少し明るいボーダー
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  // アイコン
  ctx.font = Math.floor(h * 0.25) + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(item.icon, x + w/2, y + h * 0.35);
  // ラベル
  ctx.fillStyle = 'white';
  ctx.font = 'bold ' + Math.floor(h * 0.12) + 'px -apple-system, Hiragino Sans, sans-serif';
  ctx.fillText(item.label, x + w/2, y + h * 0.62);
  // サブ
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = Math.floor(h * 0.07) + 'px -apple-system, Hiragino Sans, sans-serif';
  ctx.fillText(item.sub, x + w/2, y + h * 0.78);
}

// canvasで描画 → img タグのsrcに変換（長押しで保存可能にする）

// 一枚画像 (2500 x 843) — 横3列 × 縦2行
var fullW = 2500, fullH = 843;
var cellW = fullW / 3, cellH = fullH / 2;
var fullCanvas = document.createElement('canvas');
fullCanvas.width = fullW;
fullCanvas.height = fullH;
var fctx = fullCanvas.getContext('2d');
fctx.fillStyle = '#1b4332';
fctx.fillRect(0, 0, fullW, fullH);

items.forEach(function(item, i) {
  var col = i % 3;
  var row = Math.floor(i / 3);
  var x = col * cellW + 4;
  var y = row * cellH + 4;
  drawCell(fctx, item, x, y, cellW - 8, cellH - 8);
});

// canvas → img に変換（長押しでカメラロール保存可能）
document.getElementById('fullImg').src = fullCanvas.toDataURL('image/png');

</script>
</body>
</html>
