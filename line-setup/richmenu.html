<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リッチメニュー画像 | 建築資源循環ラボ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Hiragino Sans', sans-serif; background: #f5f5f5; color: #333; padding: 16px; }
  h1 { font-size: 16px; text-align: center; color: #2d6a4f; margin-bottom: 8px; }
  .note { font-size: 12px; color: #666; text-align: center; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 400px; margin: 0 auto; }
  .cell { position: relative; }
  .cell canvas { width: 100%; border-radius: 8px; display: block; }
  .dl-btn { display: block; margin-top: 4px; background: #2d6a4f; color: white; border: none; border-radius: 6px; padding: 6px; font-size: 12px; font-weight: bold; cursor: pointer; width: 100%; text-align: center; }
  .dl-btn.done { background: #06C755; }
  .full { margin-top: 20px; max-width: 400px; margin-left: auto; margin-right: auto; }
  .full canvas { width: 100%; border-radius: 8px; display: block; }
  .sep { border-top: 1px solid #ddd; margin: 24px 0 16px; padding-top: 12px; }
  .sep h2 { font-size: 14px; color: #2d6a4f; text-align: center; margin-bottom: 4px; }
  .sep p { font-size: 12px; color: #666; text-align: center; }
</style>
</head>
<body>

<h1>リッチメニュー画像ダウンロード</h1>
<p class="note">各画像の「保存」ボタンをタップ → 画像が開きます → 長押しで保存<br>または下の1枚画像をそのまま使用</p>

<div class="grid" id="grid"></div>

<div class="sep">
  <h2>一枚画像（これ1枚でもOK）</h2>
  <p>長押しして画像を保存 → リッチメニューの背景画像としてアップロード</p>
</div>
<div class="full">
  <canvas id="fullCanvas" width="2500" height="1686"></canvas>
  <button class="dl-btn" onclick="downloadFull()">一枚画像を保存</button>
</div>

<script>
var items = [
  { icon: '🏗️', label: 'サービス内容', sub: 'Service' },
  { icon: '💬', label: '相談する', sub: 'Contact' },
  { icon: '📋', label: '相談テーマ', sub: 'Themes' },
  { icon: '🤝', label: 'パートナー募集', sub: 'Partner' },
  { icon: '👥', label: '仲間になる', sub: 'Join Us' },
  { icon: '❓', label: 'よくある質問', sub: 'FAQ' }
];

var W = 625, H = 562; // 各セルサイズ (2500/2 x 1686/3 に近い値)

function drawCell(ctx, item, x, y, w, h) {
  // 背景
  ctx.fillStyle = '#2d6a4f';
  ctx.fillRect(x, y, w, h);
  // 内側に少し明るいボーダー
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  // アイコン
  ctx.font = Math.floor(h * 0.25) + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(item.icon, x + w/2, y + h * 0.35);
  // ラベル
  ctx.fillStyle = 'white';
  ctx.font = 'bold ' + Math.floor(h * 0.12) + 'px -apple-system, Hiragino Sans, sans-serif';
  ctx.fillText(item.label, x + w/2, y + h * 0.62);
  // サブ
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = Math.floor(h * 0.07) + 'px -apple-system, Hiragino Sans, sans-serif';
  ctx.fillText(item.sub, x + w/2, y + h * 0.78);
}

// 個別画像
var grid = document.getElementById('grid');
items.forEach(function(item, i) {
  var div = document.createElement('div');
  div.className = 'cell';
  var canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  canvas.id = 'cell' + i;
  var ctx = canvas.getContext('2d');
  // 角丸背景
  ctx.fillStyle = '#2d6a4f';
  ctx.fillRect(0, 0, W, H);
  drawCell(ctx, item, 0, 0, W, H);
  div.appendChild(canvas);

  var btn = document.createElement('button');
  btn.className = 'dl-btn';
  btn.textContent = item.label + ' を保存';
  btn.onclick = (function(c, b, name) {
    return function() {
      var link = document.createElement('a');
      link.download = 'richmenu-' + (name) + '.png';
      link.href = c.toDataURL('image/png');
      link.click();
      b.textContent = '保存しました';
      b.className = 'dl-btn done';
    };
  })(canvas, btn, item.sub.toLowerCase());
  div.appendChild(btn);
  grid.appendChild(div);
});

// 一枚画像 (2500 x 1686)
var fullW = 2500, fullH = 1686;
var cellW = fullW / 2, cellH = fullH / 3;
var fullCanvas = document.getElementById('fullCanvas');
var fctx = fullCanvas.getContext('2d');
fctx.fillStyle = '#1b4332';
fctx.fillRect(0, 0, fullW, fullH);

items.forEach(function(item, i) {
  var col = i % 2;
  var row = Math.floor(i / 2);
  var x = col * cellW + 4;
  var y = row * cellH + 4;
  drawCell(fctx, item, x, y, cellW - 8, cellH - 8);
});

function downloadFull() {
  var link = document.createElement('a');
  link.download = 'richmenu-full.png';
  link.href = fullCanvas.toDataURL('image/png');
  link.click();
  var btn = document.querySelector('.full .dl-btn');
  btn.textContent = '保存しました';
  btn.className = 'dl-btn done';
}
</script>
</body>
</html>
