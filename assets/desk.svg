<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">オーク天板のミーティングテーブル｜サンプルイラスト</title><desc id="desc">木目のあるオーク色の天板と黒いスチール脚のミーティングテーブル。架空の掲載例を表すイラストで、実物の商品写真ではありません。</desc>
