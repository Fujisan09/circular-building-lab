<title id="cbrl-art-title">建築資源を次の建築へつなぐ概念図</title>
<desc id="cbrl-art-desc">既存の建築から取り出した梁、床材、ガラス、椅子を、情報と接続を整えて次の建築へ引き継ぐ。二つの建物を立体的な設計図で表現したイラスト。</desc>
