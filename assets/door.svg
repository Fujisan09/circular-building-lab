<title id="title">木製室内ドア｜サンプルイラスト</title><desc id="desc">ナチュラルな木目、濃い色のレバーハンドルと枠を備えた室内ドア。架空の掲載例を表すイラストで、実物の商品写真ではありません。</desc>
