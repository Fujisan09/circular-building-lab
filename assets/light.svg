<filter id="shadow" x="-50%" y="-150%" width="200%" height="400%"><feGaussianBlur stdDeviation="11"/></filter>
<linearGradient id="metal" x1="0" x2="1" y1="0" y2=".4"><stop stop-color="#34444e"/><stop offset=".45" stop-color="#65717a"/><stop offset=".6" stop-color="#35434c"/><stop offset="1" stop-color="#202e36"/></linearGradient>

<linearGradient id="body" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#afb8bd"/><stop offset=".45" stop-color="#f0f0e9"/><stop offset="1" stop-color="#a7b0b4"/></linearGradient>
<linearGradient id="diffuser" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fffdf4"/><stop offset="1" stop-color="#e6e3c7"/></linearGradient>
<filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="18"/></filter></defs>
