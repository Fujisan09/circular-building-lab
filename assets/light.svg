<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">LEDベースライト｜サンプルイラスト</title><desc id="desc">細いワイヤーで吊られたアルミ色の長方形LED照明器具。架空の掲載例を表すイラストで、実物の商品写真ではありません。</desc>
